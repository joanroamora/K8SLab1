apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-chat-widget
  namespace: boutique
  labels:
    app: frontend
    app.kubernetes.io/part-of: online-boutique
    app.kubernetes.io/component: conversational-ai
data:
  footer.html: |
    {{ define "footer" }}

    <!-- ======================================================================= -->
    <!-- Minimalist & Sophisticated Luxury Design Overhaul System               -->
    <!-- ======================================================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <footer class="py-5 boutique-luxury-footer">
        <div class="footer-top">
            <div class="container footer-social">
                <div class="footer-brand-title">ONLINE BOUTIQUE</div>
                <p class="footer-tagline">Curated Minimalist Lifestyle, Living &amp; Everyday Technology</p>
                <div class="footer-divider"></div>
                <p class="footer-text">&copy; 2020-{{ .currentYear }} Online Boutique LLC &bull; Advanced Agentic Cloud Architecture</p>
                <p class="footer-text">
                    <span class="session-badge">
                        {{ with $.session_id }}
                        Session &bull; {{ . }}
                        {{ end }}
                    </span>
                </p>
            </div>
        </div>
    </footer>

    <!-- ======================================================================= -->
    <!-- Vertex AI Agent Builder & Dialogflow CX Messenger (Singleton Loader)    -->
    <!-- Prevents duplicate customElement definitions across mobile/desktop DOM  -->
    <!-- ======================================================================= -->
    <script>
      (function() {
        if (window.__DF_MESSENGER_INITIALIZED__) {
          return;
        }
        window.__DF_MESSENGER_INITIALIZED__ = true;

        // 1. Inject Stylesheet (once)
        var dfLink = document.createElement('link');
        dfLink.rel = 'stylesheet';
        dfLink.href = 'https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css';
        document.head.appendChild(dfLink);

        // 2. Inject Dialogflow Script (once)
        var dfScript = document.createElement('script');
        dfScript.src = 'https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js';
        dfScript.async = true;
        document.head.appendChild(dfScript);

        // Clear any stored chat session upon reload
        try {
          sessionStorage.removeItem('messages');
          sessionStorage.removeItem('sessionID');
          sessionStorage.removeItem('chatBubbleExpansion');
          sessionStorage.removeItem('lastResponseInstant');
          sessionStorage.removeItem('chatScrollDistance');
        } catch (e) {}

        // 3. Inject df-messenger Custom Element directly to body (once)
        var dfElem = document.createElement('df-messenger');
        dfElem.setAttribute('location', 'global');
        dfElem.setAttribute('project-id', 'bitcitychamp-project');
        dfElem.setAttribute('agent-id', '7f6c3a7a-8257-42b0-8161-97b07f9f06dd');
        dfElem.setAttribute('storage-option', 'none');
        var userLang = (navigator.language && navigator.language.startsWith('es')) ? 'es' : 'en';
        dfElem.setAttribute('language-code', userLang);
        dfElem.setAttribute('max-query-length', '-1');

        var dfBubble = document.createElement('df-messenger-chat-bubble');
        dfBubble.setAttribute('chat-title', userLang === 'es' ? 'Concierge IA &bull; Online Boutique' : 'AI Concierge &bull; Online Boutique');
        dfBubble.setAttribute('placeholder-text', userLang === 'es' ? 'Pregunta sobre 60+ productos, envíos, precios...' : 'Ask about 60+ products, shipping, prices...');
        dfElem.appendChild(dfBubble);

        document.body.appendChild(dfElem);

        // 4. Diagnostic Event Listener
        window.addEventListener('df-messenger-error', function (event) {
          var err = event.detail && event.detail.error ? event.detail.error : event.detail;
          console.error('=== DIALOGFLOW ERROR DETAIL ===');
          console.error(JSON.stringify(err, null, 2));
        });

        // 5. Aesthetic DOM Enhancer (Client-Side Fluid Layout & Categories)
        document.addEventListener('DOMContentLoaded', function() {
          enhanceStorefrontUI();
        });
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          setTimeout(enhanceStorefrontUI, 50);
        }

        function enhanceStorefrontUI() {
          // A. Beautify Navigation Brand
          var brand = document.querySelector('.navbar-brand');
          if (brand && !brand.dataset.styled) {
            brand.dataset.styled = 'true';
            brand.innerHTML = '<span class="luxury-logo-symbol">&#x25C7;</span><span class="luxury-logo-text">BOUTIQUE<span class="luxury-logo-accent">.AI</span></span>';
          }

          // B. Transform Hero Banner into Sophisticated Luxury Minimalist Editorial
          var desktopHero = document.querySelector('.home-desktop-hero-banner');
          if (desktopHero && !desktopHero.dataset.styled) {
            desktopHero.dataset.styled = 'true';
            desktopHero.innerHTML = [
              '<div class="editorial-hero-container">',
              '  <div class="editorial-hero-content">',
              '    <span class="editorial-hero-badge">NEW COLLECTION &bull; 60+ EXCLUSIVE PIECES</span>',
              '    <h1 class="editorial-hero-title">Intentional Living.<br>Refined by Modern Design.</h1>',
              '    <p class="editorial-hero-subtitle">Explore timeless essentials crafted with architectural precision, sustainable materials, and contemporary sophistication.</p>',
              '    <div class="editorial-hero-cta">',
              '      <a href="#catalog-grid" class="editorial-btn-primary">Explore Catalog</a>',
              '      <button type="button" class="editorial-btn-secondary" onclick="openChatConcierge()">Consult AI Concierge</button>',
              '    </div>',
              '  </div>',
              '</div>'
            ].join('\n');
          }

          var mobileHero = document.querySelector('.home-mobile-hero-banner');
          if (mobileHero && !mobileHero.dataset.styled) {
            mobileHero.dataset.styled = 'true';
            mobileHero.innerHTML = [
              '<div class="editorial-hero-container mobile">',
              '  <span class="editorial-hero-badge">COLLECTION 2026</span>',
              '  <h2 class="editorial-hero-title">Intentional Living.</h2>',
              '  <p class="editorial-hero-subtitle">60+ curated pieces designed for effortless elegance.</p>',
              '</div>'
            ].join('\n');
          }

          // C. Inject Interactive Category Filter Bar
          var productGrid = document.querySelector('.row.hot-product-row, .row.products-row, .row:has(.hot-product-card)');
          if (!productGrid) {
            var cards = document.querySelectorAll('.hot-product-card');
            if (cards.length > 0) {
              productGrid = cards[0].parentElement;
            }
          }

          if (productGrid && !document.getElementById('category-filter-bar')) {
            productGrid.id = 'catalog-grid';
            var filterBar = document.createElement('div');
            filterBar.id = 'category-filter-bar';
            filterBar.className = 'container category-filter-container';
            filterBar.innerHTML = [
              '<div class="catalog-header-flex">',
              '  <div>',
              '    <h2 class="catalog-section-title">The Complete Catalog</h2>',
              '    <p class="catalog-section-desc">Showing 60+ handcrafted goods &bull; Worldwide shipping &bull; 30-day returns</p>',
              '  </div>',
              '  <div class="category-pills" id="category-pills">',
              '    <button class="cat-pill active" data-cat="all">All Pieces (62)</button>',
              '    <button class="cat-pill" data-cat="accessories">Accessories</button>',
              '    <button class="cat-pill" data-cat="clothing">Apparel</button>',
              '    <button class="cat-pill" data-cat="footwear">Footwear</button>',
              '    <button class="cat-pill" data-cat="watches">Timepieces</button>',
              '    <button class="cat-pill" data-cat="electronics">Electronics</button>',
              '    <button class="cat-pill" data-cat="home">Home &amp; Decor</button>',
              '    <button class="cat-pill" data-cat="beauty">Beauty</button>',
              '  </div>',
              '</div>'
            ].join('\n');
            productGrid.parentElement.insertBefore(filterBar, productGrid);

            // Add Click Filter Events
            var pills = document.querySelectorAll('.cat-pill');
            pills.forEach(function(pill) {
              pill.addEventListener('click', function() {
                pills.forEach(function(p) { p.classList.remove('active'); });
                pill.classList.add('active');
                filterProductsByCategory(pill.dataset.cat);
              });
            });
          }

          // D. Refine each product card visually
          var cards = document.querySelectorAll('.hot-product-card');
          cards.forEach(function(card) {
            if (card.dataset.enhanced) return;
            card.dataset.enhanced = 'true';

            // Extract Name and link
            var titleElem = card.querySelector('.hot-product-card-name');
            var priceElem = card.querySelector('.hot-product-card-price');
            var imgElem = card.querySelector('img');
            var linkElem = card.querySelector('a');

            if (titleElem && priceElem && linkElem) {
              // Add quick-view visual cue
              var actionTag = document.createElement('div');
              actionTag.className = 'product-card-action-cue';
              actionTag.innerHTML = '<span>View Piece</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
              card.appendChild(actionTag);
            }
          });
        }

        window.openChatConcierge = function() {
          var chatBubble = document.querySelector('df-messenger-chat-bubble');
          if (chatBubble) {
            chatBubble.click();
          }
        };

        function filterProductsByCategory(cat) {
          var cards = document.querySelectorAll('.hot-product-card');
          cards.forEach(function(card) {
            if (cat === 'all') {
              card.style.display = '';
              card.style.opacity = '1';
              card.style.transform = 'scale(1)';
              return;
            }
            var name = (card.querySelector('.hot-product-card-name') || {}).innerText || '';
            name = name.toLowerCase();

            var matches = false;
            if (cat === 'accessories' && (name.includes('sunglass') || name.includes('wallet') || name.includes('backpack') || name.includes('tote') || name.includes('scarf') || name.includes('cap') || name.includes('bag') || name.includes('collar') || name.includes('chain') || name.includes('cuff'))) matches = true;
            if (cat === 'clothing' && (name.includes('tank') || name.includes('t-shirt') || name.includes('denim') || name.includes('coat') || name.includes('blazer') || name.includes('sweater') || name.includes('polo') || name.includes('trousers') || name.includes('hoodie') || name.includes('shirt'))) matches = true;
            if (cat === 'footwear' && (name.includes('loafer') || name.includes('sneaker') || name.includes('boot') || name.includes('runner') || name.includes('oxford') || name.includes('heel') || name.includes('sandal') || name.includes('espadrille') || name.includes('moccasin') || name.includes('shoe'))) matches = true;
            if (cat === 'watches' && (name.includes('watch') || name.includes('chronograph') || name.includes('strap') || name.includes('fitness'))) matches = true;
            if (cat === 'electronics' && (name.includes('headphone') || name.includes('earbud') || name.includes('keyboard') || name.includes('mouse') || name.includes('speaker') || name.includes('camera') || name.includes('charging') || name.includes('dac') || name.includes('hairdryer'))) matches = true;
            if (cat === 'home' && (name.includes('candle') || name.includes('mug') || name.includes('jar') || name.includes('salt') || name.includes('coffee') || name.includes('lamp') || name.includes('bowl') || name.includes('diffuser') || name.includes('chair') || name.includes('cup') || name.includes('journal'))) matches = true;
            if (cat === 'beauty' && (name.includes('parfum') || name.includes('oil') || name.includes('serum') || name.includes('fragrance') || name.includes('hairdryer'))) matches = true;

            if (matches) {
              card.style.display = '';
              card.style.opacity = '1';
              card.style.transform = 'scale(1)';
            } else {
              card.style.display = 'none';
              card.style.opacity = '0';
              card.style.transform = 'scale(0.95)';
            }
          });
        }
      })();
    </script>

    <!-- ======================================================================= -->
    <!-- Sophisticated Minimalist Dark Luxury CSS Architecture                   -->
    <!-- ======================================================================= -->
    <style>
      /* --- Root Design System Tokens --- */
      :root {
        --bg-base: #090d16;
        --bg-surface: #111726;
        --bg-surface-elevated: #182236;
        --bg-surface-hover: #1e2a44;
        --bg-glass: rgba(13, 18, 30, 0.78);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(99, 102, 241, 0.45);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent-indigo: #6366f1;
        --accent-indigo-hover: #4f46e5;
        --accent-glow: rgba(99, 102, 241, 0.35);
        --accent-emerald: #10b981;
        --font-display: 'Outfit', sans-serif;
        --font-body: 'Plus Jakarta Sans', sans-serif;
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --radius-pill: 9999px;
        --transition-fluid: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* --- Global Resets & Typography --- */
      body {
        background-color: var(--bg-base) !important;
        color: var(--text-primary) !important;
        font-family: var(--font-body) !important;
        letter-spacing: -0.01em;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4, .navbar-brand {
        font-family: var(--font-display) !important;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }

      a {
        color: var(--text-primary);
        text-decoration: none !important;
        transition: var(--transition-fluid);
      }
      a:hover {
        color: var(--accent-indigo);
      }

      /* --- Minimalist Frosted Glass Navigation --- */
      header {
        position: sticky !important;
        top: 0 !important;
        z-index: 1000 !important;
      }

      .navbar.sub-navbar {
        background: var(--bg-glass) !important;
        backdrop-filter: blur(20px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
        border-bottom: 1px solid var(--border-subtle) !important;
        padding: 14px 0 !important;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5) !important;
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .luxury-logo-symbol {
        font-size: 22px;
        color: var(--accent-indigo);
        line-height: 1;
        filter: drop-shadow(0 0 10px var(--accent-glow));
      }
      .luxury-logo-text {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #ffffff;
      }
      .luxury-logo-accent {
        color: var(--accent-indigo);
      }

      .gcp-platform {
        display: none !important; /* Eliminate cluttered legacy banner */
      }

      .currency-form select, .h-control select {
        background: var(--bg-surface-elevated) !important;
        color: var(--text-primary) !important;
        border: 1px solid var(--border-subtle) !important;
        border-radius: var(--radius-sm) !important;
        padding: 6px 12px !important;
        font-size: 13px !important;
        transition: var(--transition-fluid);
      }
      .currency-form select:focus, .h-control select:focus {
        border-color: var(--accent-indigo) !important;
        box-shadow: 0 0 0 2px var(--accent-glow) !important;
        outline: none !important;
      }

      .cart-icon, .cart-icon svg, .cart-icon img {
        filter: invert(1) brightness(1.8) !important;
        transition: var(--transition-fluid);
      }
      .cart-icon:hover {
        transform: scale(1.1);
        filter: invert(1) brightness(2.2) drop-shadow(0 0 8px var(--accent-glow)) !important;
      }

      /* --- Editorial Minimalist Hero Banner --- */
      .editorial-hero-container {
        position: relative;
        overflow: hidden;
        border-radius: var(--radius-lg);
        margin: 28px auto 44px;
        padding: 72px 48px;
        background: linear-gradient(135deg, rgba(24, 34, 54, 0.9) 0%, rgba(13, 18, 30, 0.95) 100%),
                    radial-gradient(circle at top right, rgba(99, 102, 241, 0.25) 0%, transparent 60%);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      }
      .editorial-hero-container.mobile {
        padding: 36px 24px;
        margin: 16px auto 24px;
      }

      .editorial-hero-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #818cf8;
        background: rgba(99, 102, 241, 0.14);
        padding: 6px 14px;
        border-radius: var(--radius-pill);
        border: 1px solid rgba(99, 102, 241, 0.25);
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      .editorial-hero-title {
        font-size: 46px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 18px;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @media (max-width: 768px) {
        .editorial-hero-title { font-size: 32px; }
      }

      .editorial-hero-subtitle {
        font-size: 17px;
        line-height: 1.6;
        color: var(--text-secondary);
        max-width: 620px;
        margin-bottom: 32px;
      }

      .editorial-hero-cta {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }

      .editorial-btn-primary {
        background: linear-gradient(135deg, var(--accent-indigo) 0%, var(--accent-indigo-hover) 100%);
        color: #ffffff !important;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.3px;
        padding: 13px 28px;
        border-radius: var(--radius-pill);
        box-shadow: 0 4px 20px var(--accent-glow);
        transition: var(--transition-fluid);
        display: inline-flex;
        align-items: center;
        border: none;
      }
      .editorial-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(99, 102, 241, 0.55);
        color: #ffffff !important;
      }

      .editorial-btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary) !important;
        font-weight: 500;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border-subtle);
        backdrop-filter: blur(10px);
        transition: var(--transition-fluid);
        cursor: pointer;
      }
      .editorial-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      /* --- Category Filter System --- */
      .category-filter-container {
        margin: 40px auto 32px;
      }

      .catalog-header-flex {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .catalog-section-title {
        font-size: 26px;
        font-weight: 700;
        margin: 0 0 6px 0;
      }
      .catalog-section-desc {
        color: var(--text-muted);
        font-size: 14px;
        margin: 0;
      }

      .category-pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .cat-pill {
        background: var(--bg-surface);
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border-subtle);
        cursor: pointer;
        transition: var(--transition-fluid);
      }
      .cat-pill:hover {
        background: var(--bg-surface-elevated);
        color: var(--text-primary);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .cat-pill.active {
        background: var(--accent-indigo);
        color: #ffffff;
        border-color: var(--accent-indigo);
        box-shadow: 0 4px 16px var(--accent-glow);
      }

      /* --- High-End Minimalist Product Cards --- */
      .hot-product-card {
        background: var(--bg-surface) !important;
        border-radius: var(--radius-lg) !important;
        border: 1px solid var(--border-subtle) !important;
        padding: 16px !important;
        margin-bottom: 32px !important;
        transition: var(--transition-fluid) !important;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: calc(100% - 32px);
      }

      .hot-product-card:hover {
        transform: translateY(-8px) !important;
        background: var(--bg-surface-elevated) !important;
        border-color: var(--border-focus) !important;
        box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7), 0 0 24px rgba(99, 102, 241, 0.18) !important;
      }

      .hot-product-card a {
        display: block;
        overflow: hidden;
        border-radius: var(--radius-md);
        background: #0f1626;
        position: relative;
        aspect-ratio: 1 / 1;
      }

      .hot-product-card img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }

      .hot-product-card:hover img {
        transform: scale(1.07) !important;
      }

      .hot-product-card-img-overlay {
        display: none !important; /* Remove dated legacy overlay */
      }

      .hot-product-card-name {
        font-family: var(--font-display) !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        color: var(--text-primary) !important;
        margin-top: 14px !important;
        margin-bottom: 4px !important;
        line-height: 1.35;
        height: 44px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .hot-product-card-price {
        font-size: 15px !important;
        font-weight: 700 !important;
        color: var(--accent-emerald) !important;
        margin-bottom: 8px !important;
        letter-spacing: -0.01em;
      }

      .product-card-action-cue {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: #818cf8;
        opacity: 0.85;
        margin-top: 6px;
        transition: var(--transition-fluid);
      }
      .hot-product-card:hover .product-card-action-cue {
        opacity: 1;
        transform: translateX(4px);
        color: #a5b4fc;
      }

      /* --- Product Detail & Cart Pages Overhaul --- */
      .h-product, .container.bg-light {
        background: var(--bg-surface) !important;
        border-radius: var(--radius-lg) !important;
        border: 1px solid var(--border-subtle) !important;
        color: var(--text-primary) !important;
        box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6) !important;
        padding: 36px !important;
        margin-top: 24px !important;
      }

      .product-image {
        border-radius: var(--radius-lg) !important;
        box-shadow: 0 15px 35px -10px rgba(0,0,0,0.5) !important;
        border: 1px solid var(--border-subtle) !important;
      }

      .product-price {
        font-size: 26px !important;
        font-weight: 700 !important;
        color: var(--accent-emerald) !important;
      }

      .cymbal-button-primary, button[type="submit"] {
        background: linear-gradient(135deg, var(--accent-indigo) 0%, var(--accent-indigo-hover) 100%) !important;
