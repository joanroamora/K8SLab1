apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-chat-widget
  namespace: boutique
  labels:
    app: frontend
    app.kubernetes.io/part-of: online-boutique
    app.kubernetes.io/component: conversational-ai
data:
  footer.html: |
    {{ define "footer" }}

    <!-- ======================================================================= -->
    <!-- Minimalist & Sophisticated Studio Luxury Design Architecture            -->
    <!-- Clean, High-Contrast Light Editorial Palette (100% Crystal-Clear Text) -->
    <!-- ======================================================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <footer class="py-5 boutique-luxury-footer">
        <div class="footer-top">
            <div class="container footer-social">
                <div class="footer-brand-title">ONLINE BOUTIQUE</div>
                <p class="footer-tagline">Curated Minimalist Lifestyle, Living &amp; Everyday Technology</p>
                <div class="footer-divider"></div>
                <p class="footer-text">&copy; 2020-{{ .currentYear }} Online Boutique LLC &bull; Advanced Cloud Architecture</p>
                <p class="footer-text">
                    <span class="session-badge">
                        {{ with $.session_id }}
                        Session &bull; {{ . }}
                        {{ end }}
                    </span>
                </p>
            </div>
        </div>
    </footer>

    <!-- ======================================================================= -->
    <!-- Vertex AI Agent Builder & Dialogflow CX Messenger (Singleton Loader)    -->
    <!-- Prevents duplicate customElement definitions across mobile/desktop DOM  -->
    <!-- ======================================================================= -->
    <script>
      (function() {
        if (window.__DF_MESSENGER_INITIALIZED__) {
          return;
        }
        window.__DF_MESSENGER_INITIALIZED__ = true;

        // 1. Inject Stylesheet (once)
        var dfLink = document.createElement('link');
        dfLink.rel = 'stylesheet';
        dfLink.href = 'https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css';
        document.head.appendChild(dfLink);

        // 2. Inject Dialogflow Script (once)
        var dfScript = document.createElement('script');
        dfScript.src = 'https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js';
        dfScript.async = true;
        document.head.appendChild(dfScript);

        // Clear any stored chat session upon reload
        try {
          sessionStorage.removeItem('messages');
          sessionStorage.removeItem('sessionID');
          sessionStorage.removeItem('chatBubbleExpansion');
          sessionStorage.removeItem('lastResponseInstant');
          sessionStorage.removeItem('chatScrollDistance');
        } catch (e) {}

        // 3. Inject df-messenger Custom Element directly to body (once)
        var dfElem = document.createElement('df-messenger');
        dfElem.setAttribute('location', 'global');
        dfElem.setAttribute('project-id', 'bitcitychamp-project');
        dfElem.setAttribute('agent-id', '7f6c3a7a-8257-42b0-8161-97b07f9f06dd');
        dfElem.setAttribute('storage-option', 'none');
        var userLang = (navigator.language && navigator.language.startsWith('es')) ? 'es' : 'en';
        dfElem.setAttribute('language-code', userLang);
        dfElem.setAttribute('max-query-length', '-1');

        var dfBubble = document.createElement('df-messenger-chat-bubble');
        dfBubble.setAttribute('chat-title', userLang === 'es' ? 'Asistente IA &bull; Online Boutique' : 'AI Assistant &bull; Online Boutique');
        dfBubble.setAttribute('placeholder-text', userLang === 'es' ? 'Pregunta sobre productos, envíos, precios...' : 'Ask about products, shipping, prices...');
        dfElem.appendChild(dfBubble);

        document.body.appendChild(dfElem);

        // 4. Diagnostic Event Listener
        window.addEventListener('df-messenger-error', function (event) {
          var err = event.detail && event.detail.error ? event.detail.error : event.detail;
          console.error('=== DIALOGFLOW ERROR DETAIL ===');
          console.error(JSON.stringify(err, null, 2));
        });

        // 5. Aesthetic DOM Enhancer
        document.addEventListener('DOMContentLoaded', function() {
          enhanceStorefrontUI();
        });
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          setTimeout(enhanceStorefrontUI, 50);
        }

        function enhanceStorefrontUI() {
          // A. Clean Minimalist Brand
          var brand = document.querySelector('.navbar-brand');
          if (brand && !brand.dataset.styled) {
            brand.dataset.styled = 'true';
            brand.innerHTML = '<span class="luxury-logo-symbol">&#x25C7;</span><span class="luxury-logo-text">ONLINE BOUTIQUE</span>';
          }

          // B. Minimalist Studio Editorial Hero
          var desktopHero = document.querySelector('.home-desktop-hero-banner');
          if (desktopHero && !desktopHero.dataset.styled) {
            desktopHero.dataset.styled = 'true';
            desktopHero.innerHTML = [
              '<div class="editorial-hero-container">',
              '  <div class="editorial-hero-content">',
              '    <span class="editorial-hero-badge">NEW SEASON &bull; 60+ EXCLUSIVE PIECES</span>',
              '    <h1 class="editorial-hero-title">Curated Essentials.<br>Architectural Simplicity.</h1>',
              '    <p class="editorial-hero-subtitle">Timeless designs crafted with uncompromising quality, sustainable materials, and minimalist elegance.</p>',
              '    <div class="editorial-hero-cta">',
              '      <a href="#catalog-grid" class="editorial-btn-primary">Explore Catalog</a>',
              '      <button type="button" class="editorial-btn-secondary" onclick="openChatConcierge()">Consult AI Concierge</button>',
              '    </div>',
              '  </div>',
              '</div>'
            ].join('\n');
          }

          var mobileHero = document.querySelector('.home-mobile-hero-banner');
          if (mobileHero && !mobileHero.dataset.styled) {
            mobileHero.dataset.styled = 'true';
            mobileHero.innerHTML = [
              '<div class="editorial-hero-container mobile">',
              '  <span class="editorial-hero-badge">COLLECTION 2026</span>',
              '  <h2 class="editorial-hero-title">Curated Essentials.</h2>',
              '  <p class="editorial-hero-subtitle">60+ exclusive pieces designed for everyday elegance.</p>',
              '</div>'
            ].join('\n');
          }

          // C. Category Filter Bar
          var productGrid = document.querySelector('.row.hot-product-row, .row.products-row, .row:has(.hot-product-card)');
          if (!productGrid) {
            var cards = document.querySelectorAll('.hot-product-card');
            if (cards.length > 0) {
              productGrid = cards[0].parentElement;
            }
          }

          if (productGrid && !document.getElementById('category-filter-bar')) {
            productGrid.id = 'catalog-grid';
            var filterBar = document.createElement('div');
            filterBar.id = 'category-filter-bar';
            filterBar.className = 'container category-filter-container';
            filterBar.innerHTML = [
              '<div class="catalog-header-flex">',
              '  <div>',
              '    <h2 class="catalog-section-title">The Curated Collection</h2>',
              '    <p class="catalog-section-desc">Showing 60+ handcrafted pieces &bull; Worldwide shipping &bull; 30-day returns</p>',
              '  </div>',
              '  <div class="category-pills" id="category-pills">',
              '    <button class="cat-pill active" data-cat="all">All (62)</button>',
              '    <button class="cat-pill" data-cat="accessories">Accessories</button>',
              '    <button class="cat-pill" data-cat="clothing">Apparel</button>',
              '    <button class="cat-pill" data-cat="footwear">Footwear</button>',
              '    <button class="cat-pill" data-cat="watches">Timepieces</button>',
              '    <button class="cat-pill" data-cat="electronics">Electronics</button>',
              '    <button class="cat-pill" data-cat="home">Home &amp; Living</button>',
              '    <button class="cat-pill" data-cat="beauty">Beauty</button>',
              '  </div>',
              '</div>'
            ].join('\n');
            productGrid.parentElement.insertBefore(filterBar, productGrid);

            var pills = document.querySelectorAll('.cat-pill');
            pills.forEach(function(pill) {
              pill.addEventListener('click', function() {
                pills.forEach(function(p) { p.classList.remove('active'); });
                pill.classList.add('active');
                filterProductsByCategory(pill.dataset.cat);
              });
            });
          }

          // D. Product card badges
          var cards = document.querySelectorAll('.hot-product-card');
          cards.forEach(function(card) {
            if (card.dataset.enhanced) return;
            card.dataset.enhanced = 'true';

            var titleElem = card.querySelector('.hot-product-card-name');
            var priceElem = card.querySelector('.hot-product-card-price');
            var linkElem = card.querySelector('a');

            if (titleElem && priceElem && linkElem) {
              var actionTag = document.createElement('div');
              actionTag.className = 'product-card-action-cue';
              actionTag.innerHTML = '<span>View Piece</span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
              card.appendChild(actionTag);
            }
          });
        }

        window.openChatConcierge = function() {
          var chatBubble = document.querySelector('df-messenger-chat-bubble');
          if (chatBubble) {
            chatBubble.click();
          }
        };

        function filterProductsByCategory(cat) {
          var cards = document.querySelectorAll('.hot-product-card');
          cards.forEach(function(card) {
            if (cat === 'all') {
              card.style.display = '';
              card.style.opacity = '1';
              card.style.transform = 'scale(1)';
              return;
            }
            var name = (card.querySelector('.hot-product-card-name') || {}).innerText || '';
            name = name.toLowerCase();

            var matches = false;
            if (cat === 'accessories' && (name.includes('sunglass') || name.includes('wallet') || name.includes('backpack') || name.includes('tote') || name.includes('scarf') || name.includes('cap') || name.includes('bag') || name.includes('collar') || name.includes('chain') || name.includes('cuff'))) matches = true;
            if (cat === 'clothing' && (name.includes('tank') || name.includes('t-shirt') || name.includes('denim') || name.includes('coat') || name.includes('blazer') || name.includes('sweater') || name.includes('polo') || name.includes('trousers') || name.includes('hoodie') || name.includes('shirt'))) matches = true;
            if (cat === 'footwear' && (name.includes('loafer') || name.includes('sneaker') || name.includes('boot') || name.includes('runner') || name.includes('oxford') || name.includes('heel') || name.includes('sandal') || name.includes('espadrille') || name.includes('moccasin') || name.includes('shoe'))) matches = true;
            if (cat === 'watches' && (name.includes('watch') || name.includes('chronograph') || name.includes('strap') || name.includes('fitness'))) matches = true;
            if (cat === 'electronics' && (name.includes('headphone') || name.includes('earbud') || name.includes('keyboard') || name.includes('mouse') || name.includes('speaker') || name.includes('camera') || name.includes('charging') || name.includes('dac') || name.includes('hairdryer'))) matches = true;
            if (cat === 'home' && (name.includes('candle') || name.includes('mug') || name.includes('jar') || name.includes('salt') || name.includes('coffee') || name.includes('lamp') || name.includes('bowl') || name.includes('diffuser') || name.includes('chair') || name.includes('cup') || name.includes('journal'))) matches = true;
            if (cat === 'beauty' && (name.includes('parfum') || name.includes('oil') || name.includes('serum') || name.includes('fragrance') || name.includes('hairdryer'))) matches = true;

            if (matches) {
              card.style.display = '';
              card.style.opacity = '1';
              card.style.transform = 'scale(1)';
            } else {
              card.style.display = 'none';
              card.style.opacity = '0';
              card.style.transform = 'scale(0.95)';
            }
          });
        }
      })();
    </script>

    <!-- ======================================================================= -->
    <!-- Clean, High-Contrast Minimalist Luxury Stylesheet                       -->
    <!-- ======================================================================= -->
    <style>
      /* --- Root Design System Tokens (Clean Studio Aesthetic) --- */
      :root {
        --bg-base: #f8fafc;
        --bg-surface: #ffffff;
        --bg-surface-elevated: #f1f5f9;
        --bg-glass: rgba(255, 255, 255, 0.88);
        --border-subtle: #e2e8f0;
        --border-focus: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-dark: #0f172a;
        --accent-indigo: #2563eb;
        --accent-emerald: #059669;
        --font-display: 'Outfit', sans-serif;
        --font-body: 'Plus Jakarta Sans', sans-serif;
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 18px;
        --radius-pill: 9999px;
        --transition-fluid: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* --- Global Resets & Typography --- */
      body {
        background-color: var(--bg-base) !important;
        color: var(--text-primary) !important;
        font-family: var(--font-body) !important;
        letter-spacing: -0.01em;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4, .navbar-brand {
        font-family: var(--font-display) !important;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text-primary) !important;
      }

      a {
        color: var(--text-primary);
        text-decoration: none !important;
        transition: var(--transition-fluid);
      }
      a:hover {
        color: var(--accent-indigo);
      }

      /* --- Minimalist Frosted Glass Navigation --- */
      header {
        position: sticky !important;
        top: 0 !important;
        z-index: 1000 !important;
      }

      .navbar.sub-navbar {
        background: var(--bg-glass) !important;
        backdrop-filter: blur(16px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
        border-bottom: 1px solid var(--border-subtle) !important;
        padding: 14px 0 !important;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03) !important;
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .luxury-logo-symbol {
        font-size: 20px;
        color: var(--accent-dark);
        line-height: 1;
      }
      .luxury-logo-text {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--text-primary);
      }

      .gcp-platform {
        display: none !important;
      }

      .currency-form select, .h-control select {
        background: #ffffff !important;
        color: var(--text-primary) !important;
        border: 1px solid var(--border-subtle) !important;
        border-radius: var(--radius-sm) !important;
        padding: 6px 12px !important;
        font-size: 13px !important;
        transition: var(--transition-fluid);
      }
      .currency-form select:focus, .h-control select:focus {
        border-color: var(--text-primary) !important;
        outline: none !important;
      }

      .cart-icon, .cart-icon svg, .cart-icon img {
        filter: none !important;
        transition: var(--transition-fluid);
      }
      .cart-icon:hover {
        transform: scale(1.08);
      }

      /* --- Studio Minimalist Hero Banner --- */
      .editorial-hero-container {
        position: relative;
        overflow: hidden;
        border-radius: var(--radius-lg);
        margin: 24px auto 36px;
        padding: 64px 48px;
        background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04);
      }
      .editorial-hero-container.mobile {
        padding: 32px 20px;
        margin: 16px auto 20px;
      }

      .editorial-hero-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--text-secondary);
        background: #e2e8f0;
        padding: 5px 12px;
        border-radius: var(--radius-pill);
        margin-bottom: 16px;
        text-transform: uppercase;
      }

      .editorial-hero-title {
        font-size: 44px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 16px;
        color: var(--text-primary) !important;
      }
      @media (max-width: 768px) {
        .editorial-hero-title { font-size: 30px; }
      }

      .editorial-hero-subtitle {
        font-size: 16px;
        line-height: 1.6;
        color: var(--text-secondary);
        max-width: 600px;
        margin-bottom: 28px;
      }

      .editorial-hero-cta {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .editorial-btn-primary {
        background: var(--accent-dark);
        color: #ffffff !important;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.3px;
        padding: 12px 26px;
        border-radius: var(--radius-pill);
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
        transition: var(--transition-fluid);
        display: inline-flex;
        align-items: center;
        border: none;
      }
      .editorial-btn-primary:hover {
        background: #1e293b;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.3);
        color: #ffffff !important;
      }

      .editorial-btn-secondary {
        background: #ffffff;
        color: var(--text-primary) !important;
        font-weight: 500;
        font-size: 14px;
        padding: 11px 22px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border-subtle);
        transition: var(--transition-fluid);
        cursor: pointer;
      }
      .editorial-btn-secondary:hover {
        background: #f8fafc;
        border-color: #cbd5e1;
        transform: translateY(-2px);
      }

      /* --- Category Filter System --- */
      .category-filter-container {
        margin: 36px auto 28px;
      }

      .catalog-header-flex {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .catalog-section-title {
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 4px 0;
      }
      .catalog-section-desc {
        color: var(--text-muted);
        font-size: 14px;
        margin: 0;
      }

      .category-pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .cat-pill {
        background: #ffffff;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        padding: 7px 16px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--border-subtle);
        cursor: pointer;
        transition: var(--transition-fluid);
      }
      .cat-pill:hover {
        background: #f1f5f9;
        color: var(--text-primary);
        border-color: #cbd5e1;
      }
      .cat-pill.active {
        background: var(--accent-dark);
        color: #ffffff;
        border-color: var(--accent-dark);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.18);
      }

      /* --- High-Contrast Minimalist Product Cards --- */
      .hot-product-card {
        background: var(--bg-surface) !important;
        border-radius: var(--radius-lg) !important;
        border: 1px solid var(--border-subtle) !important;
        padding: 16px !important;
        margin-bottom: 28px !important;
        transition: var(--transition-fluid) !important;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: calc(100% - 28px);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03) !important;
      }

      .hot-product-card:hover {
        transform: translateY(-6px) !important;
        border-color: #cbd5e1 !important;
        box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.08) !important;
      }

      .hot-product-card a {
        display: block;
        overflow: hidden;
        border-radius: var(--radius-md);
        background: #f1f5f9;
        position: relative;
        aspect-ratio: 1 / 1;
      }

      .hot-product-card img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }

      .hot-product-card:hover img {
        transform: scale(1.05) !important;
      }

      .hot-product-card-img-overlay {
        display: none !important;
      }

      .hot-product-card-name {
        font-family: var(--font-display) !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        color: var(--text-primary) !important;
        margin-top: 14px !important;
        margin-bottom: 4px !important;
        line-height: 1.35;
        height: 44px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .hot-product-card-price {
        font-size: 15px !important;
        font-weight: 700 !important;
        color: var(--accent-emerald) !important;
        margin-bottom: 6px !important;
        letter-spacing: -0.01em;
      }

      .product-card-action-cue {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent-indigo);
        opacity: 0.85;
        margin-top: 6px;
        transition: var(--transition-fluid);
      }
      .hot-product-card:hover .product-card-action-cue {
        opacity: 1;
        transform: translateX(4px);
      }

      /* --- Product Detail & Cart Pages Overhaul --- */
      .h-product, .container.bg-light {
        background: #ffffff !important;
        border-radius: var(--radius-lg) !important;
        border: 1px solid var(--border-subtle) !important;
        color: var(--text-primary) !important;
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05) !important;
        padding: 36px !important;
        margin-top: 24px !important;
      }

      .product-image {
        border-radius: var(--radius-lg) !important;
        box-shadow: 0 8px 24px -5px rgba(0,0,0,0.08) !important;
        border: 1px solid var(--border-subtle) !important;
      }

      .product-price {
        font-size: 26px !important;
        font-weight: 700 !important;
        color: var(--accent-emerald) !important;
      }

      .cymbal-button-primary, button[type="submit"] {
        background: var(--accent-dark) !important;
        color: #ffffff !important;
        font-weight: 600 !important;
        border: none !important;
        border-radius: var(--radius-pill) !important;
        padding: 12px 28px !important;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2) !important;
        transition: var(--transition-fluid) !important;
        cursor: pointer;
      }
      .cymbal-button-primary:hover, button[type="submit"]:hover {
        background: #1e293b !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.3) !important;
      }

      /* --- Clean Minimalist Footer --- */
      .boutique-luxury-footer {
        background: #ffffff !important;
        border-top: 1px solid var(--border-subtle) !important;
        padding: 56px 0 40px !important;
        margin-top: 64px !important;
        text-align: center;
      }
      .footer-brand-title {
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 3px;
        color: var(--text-primary);
        margin-bottom: 6px;
      }
      .footer-tagline {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 20px;
      }
      .footer-divider {
        width: 40px;
        height: 2px;
        background: var(--accent-dark);
