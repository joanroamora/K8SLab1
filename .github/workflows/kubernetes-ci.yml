name: "Kubernetes CI"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'kubernetes/**'
      - '.github/workflows/kubernetes-ci.yml'
      - '.yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: "Lint & Validate Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Run yamllint on Manifests
        run: |
          echo "==> Linting Kubernetes YAML manifests..."
          yamllint -c .yamllint.yml kubernetes/manifests/

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Validate Kustomize Build
        run: |
          echo "==> Building and validating Kustomize overlays & resources..."
          kustomize build kubernetes/manifests/ > /dev/null
          echo "✅ Kustomize build succeeded with valid schemas!"
