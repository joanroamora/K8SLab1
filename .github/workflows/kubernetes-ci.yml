name: "Kubernetes CI"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'kubernetes/**'
      - '.github/workflows/kubernetes-ci.yml'
      - '.yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: "Lint & Validate Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Run yamllint on Manifests
        run: |
          echo "==> Linting Kubernetes YAML manifests..."
          yamllint -c .yamllint.yml kubernetes/manifests/

      - name: Install Kustomize
        run: |
          curl -sLo /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          sudo tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin
          rm /tmp/kustomize.tar.gz
          kustomize version

      - name: Validate Kustomize Build
        run: |
          echo "==> Building and validating Kustomize overlays & resources..."
          kustomize build kubernetes/manifests/ > /dev/null
          echo "✅ Kustomize build succeeded with valid schemas!"
