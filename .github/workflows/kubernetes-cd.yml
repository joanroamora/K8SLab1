name: "Kubernetes CD"

on:
  push:
    branches:
      - main
    paths:
      - 'kubernetes/**'
      - '.github/workflows/kubernetes-cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cd:
    name: "Deploy to GKE Cluster"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: "gke-autopilot-lab"
          location: "us-central1"
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy Manifests via Kustomize
        run: |
          echo "==> Applying Layer 2 Manifests (Boutique, Headlamp, Observability)..."
          kubectl apply -k kubernetes/manifests/

      - name: Verify Workload Rollouts
        run: |
          echo "==> Checking rollout status for critical microservices..."
          kubectl rollout status deployment/frontend -n boutique --timeout=180s
          kubectl rollout status deployment/cartservice -n boutique --timeout=180s
          kubectl rollout status deployment/grafana -n monitoring --timeout=180s
          kubectl rollout status deployment/prometheus -n monitoring --timeout=180s
          echo "✅ All core deployments are healthy and running in GKE!"
